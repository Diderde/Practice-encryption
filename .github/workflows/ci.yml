name: CI

on:
  push:
    branches: [public]
  pull_request:

jobs:
  # 快作业：不装任何可选依赖，跑 26 个自足套件（scripts/run_suites.py --fast 为准）。
  # 这一档同时验证"零可选依赖也能跑"——numpy 缺席时穷举用例须自动降级跳过
  # （见各套件 docstring 的降级口径）；z3 缺席时只有**词法等价判定**那几条 SKIP，
  # 构建期的 T-函数副本闸门走执行法、不依赖 z3，照常执行。
  suites-minimal-deps:
    runs-on: windows-latest
    strategy:
      matrix:
        # d_side 闸门按解释器版本锚定（验证环境 3.12）；3.11 首跑 16 项失败属
        # 存量不支持，CI 先收敛到已验证环境，扩档由维护者裁决。
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (no optional deps)
        run: python -m pip install -e .
      - name: Run fast suites
        run: python scripts/run_suites.py --fast

  # 全作业：装齐可选依赖，跑全部套件（含真实项目 E2E 与 TEA 家族全域穷举）。
  # 真实项目 E2E 依赖工作区外的 markdown-reader / bili-dl（及联网取 markdown2），
  # 缺失时该套件**已登记为空档**：聚合输出为 `PASS WITH GAPS` 并列出空档与跳过数，
  # 与 `ALL PASS` 不同形。未登记的套件一旦"已执行检查数 = 0"即判失败——绿灯不掩盖空跑。
  suites-full-deps:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with optional deps
        run: |
          python -m pip install -e .
          python -m pip install --require-hashes -r requirements-lock.txt
      # 真实项目 E2E 的两个目标项目按 tests/pyshroud 的约定落在本仓检出的上一级，
      # 并各自建 venv（E2E 用目标项目自己的解释器跑其测试套件与 CLI），
      # 让该套件在 CI 里真正执行而不是登记为空档。
      # 用普通 git clone：checkout 动作不允许把检出放到工作区之外。
      - name: Clone E2E 目标项目（markdown-reader / bili-dl，检出在上一级）
        run: |
          git clone --depth 1 https://github.com/Diderde/Markdown-reader ../markdown-reader
          git clone --depth 1 https://github.com/Diderde/bili-dl ../bili-dl
      - name: 准备 markdown-reader venv（E2E 用它跑该项目全量单测）
        run: |
          python -m venv ../markdown-reader/.venv
          ../markdown-reader/.venv/Scripts/python -m pip install -e "../markdown-reader[dev]"
      - name: 准备 bili-dl venv（E2E 用它跑 python -m bili_dl --help）
        run: |
          python -m venv ../bili-dl/.venv
          ../bili-dl/.venv/Scripts/python -m pip install -e "../bili-dl"
      - name: Run all suites
        run: python scripts/run_suites.py
